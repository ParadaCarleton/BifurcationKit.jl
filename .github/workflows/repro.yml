name: repro
on:
  push:
    branches: ['ci-repro-*']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run codim_2_po_collocation
        run: julia --math-mode=ieee --color=yes --project=@. -e 'import Pkg; Pkg.test(test_args=["codim_2_po_collocation", "continuation/palc_step_control", "continuation/palc_orientation_dot"])'
