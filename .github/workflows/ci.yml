name: CI
on:
  push:
    branches: [master]
    tags: [v*]
  pull_request:

jobs:
  select:
    # Picks the test files a pull request can affect (Fallout.jl), from the
    # map that test-impact-map.yml builds on master. Without a map of the PR's base commit,
    # or if this job fails, every test runs.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.select.outputs.run }}
      tests: ${{ steps.select.outputs.tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'

      - name: Restore test impact map
        id: map
        uses: actions/cache/restore@v6
        with:
          path: test-impact-map.toml
          key: test-impact-map-${{ github.event.pull_request.base.sha }}

      - name: Select tests
        id: select
        if: steps.map.outputs.cache-matched-key != ''
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          julia --project=$RUNNER_TEMP/tia -e 'using Pkg; Pkg.add(url = "https://github.com/ParadaCarleton/Fallout.jl", rev = "2193dc36178d27b66bc18f8fb363473b2f68033e")'
          julia --project=$RUNNER_TEMP/tia -e '
            using Fallout: read_map, select_testsets, report
            map = read_map("test-impact-map.toml")
            head = readchomp(`git rev-parse HEAD`)
            selection = select_testsets(".", map, ENV["BASE"], head)
            report(stdout, map, selection, ENV["BASE"], head)
            # A test file that failed while mapping has partial coverage, so it always runs.
            failed = [name for (name, coverage) in map.testsets if coverage.status != "ok"]
            names = sort(unique(vcat(first.(selection.reasons), failed)))
            # An empty test list makes runtests.jl run everything.
            tests = isempty(selection.full) ? join(names, " ") : ""
            open(ENV["GITHUB_OUTPUT"], "a") do io
                println(io, "run=", isempty(names) ? "false" : "true")
                println(io, "tests=", tests)
            end
          '

  test:
    needs: select
    if: ${{ !cancelled() && needs.select.outputs.run != 'false' }}
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10' # Replace this with the minimum Julia version that your package supports. E.g. if your package requires Julia 1.5 or higher, change this to '1.5'.
          #- '1.3' # Leave this line unchanged. '1' will automatically expand to the latest stable 1.x release of Julia.
          # - 'nightly'
        os:
          - self-hosted
          - ubuntu-latest
          - macos-15-intel # for fun and knowledge
          # - ubuntu-latest
        # arch:
          # - x64
    steps:
      - name: Fix PATH (macOS)
        # necessary to find gpg for coverage step
        # Homebrew is located differently on macOSX/Intel and macOS/ARM
        if: runner.os == 'macOS'
        run: |
          if [ "${{ runner.arch }}" = "ARM64" ]; then
            echo "/opt/homebrew/bin:/opt/homebrew/sbin" >> $GITHUB_PATH
          else
            echo "/usr/local/bin" >> $GITHUB_PATH
          fi

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup julia
        uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          # arch: ${{ matrix.arch }} \todo required?

      - name: Cache Julia packages (GitHub-hosted runners)
        if: contains(matrix.os, 'ubuntu') || contains(matrix.os, 'windows') || contains(matrix.os, 'macOs')
        uses: julia-actions/cache@v3

      - name: Cache Julia artifacts (self-hosted runners)
        if: contains(matrix.os, 'self-hosted')
        uses: actions/cache@v6
        env:
          cache-name: cache-artifacts
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-test-${{ env.cache-name }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-test-${{ env.cache-name }}-
            ${{ runner.os }}-test-
            ${{ runner.os }}-

      - name: Cache Julia compiled code (self-hosted runners)
        if: contains(matrix.os, 'self-hosted')
        uses: actions/cache@v6
        with:
          path: ~/.julia/compiled
          key: ${{ runner.os }}-julia-compiled-${{ matrix.version }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-julia-compiled-${{ matrix.version }}-

      - name: Build julia package
        uses: julia-actions/julia-buildpkg@v1

      - name: Run tests
        env:
          JULIA_NUM_THREADS: auto
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels) }}
          SELECTED_TESTS: ${{ needs.select.outputs.tests }}
        run: |
          julia --math-mode=ieee --color=yes --project=@. -e '
            import Pkg

            # Parse labels from the environment variable using Regex to avoid JSON dependency
            labels_json = get(ENV, "PR_LABELS", "[]")

            # Regex to match "name": "value" pattern in the JSON string
            # Handles escaped quotes if necessary, though simple labels rarely have them
            name_pattern = r"\"name\"\s*:\s*\"((?:\\.|[^\"\\])*)\""

            # Extract test names from labels with the specific prefix
            prefix = "Run test(s): "
            test_args = String[]

            for m in eachmatch(name_pattern, labels_json)
                name = m.captures[1]
                if startswith(name, prefix)
                    # Remove prefix and split by space, comma, or pipe
                    arg_str = strip(replace(name, prefix => ""))
                    for arg in split(arg_str, r"[\s,|]+"; keepempty=false)
                        push!(test_args, arg)
                    end
                end
            end

            # Without test labels, run the tests the select job chose
            if isempty(test_args)
                append!(test_args, split(get(ENV, "SELECTED_TESTS", "")))
            end

            # Log what we are doing
            if isempty(test_args)
                println("No test labels and no test selection. Running all tests.")
            else
                println("Running specific tests (labels, else the select job): ", join(test_args, ", "))
            end

            # Run tests
            Pkg.test(coverage=true, test_args=test_args)
          '

      - name: Compute coverage
        uses: julia-actions/julia-processcoverage@v1

      - name: Process coverage
        uses: codecov/codecov-action@v6
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: lcov.info
